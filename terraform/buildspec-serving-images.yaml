version: 0.2

# One build per hardware (started by images.tf):
#   SOURCE_IMAGE  upstream vLLM image (Neuron DLC or vllm/vllm-openai)
#   VLLM_IMAGE    ECR copy of SOURCE_IMAGE
#   RAY_IMAGE     ECR Ray Serve image, FROM SOURCE_IMAGE + ray[serve]==RAY_VERSION

phases:
  pre_build:
    commands:
      - aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_REGISTRY
  build:
    commands:
      # 1. Copy the vLLM image to ECR.
      - docker pull $SOURCE_IMAGE
      - docker tag $SOURCE_IMAGE $VLLM_IMAGE
      - docker push $VLLM_IMAGE
      # 2. Ray Serve on top of the same image.
      - |
        cat > Dockerfile << 'EOF'
        ARG SOURCE_IMAGE
        FROM ${SOURCE_IMAGE}
        ARG RAY_VERSION
        USER root
        # vllm-openai installs with uv (system Python, maybe no pip); the Neuron DLC uses pip.
        RUN if command -v uv >/dev/null 2>&1; then \
              uv pip install --system "ray[serve]==${RAY_VERSION}"; \
            else \
              python3 -m pip install --no-cache-dir "ray[serve]==${RAY_VERSION}"; \
            fi
        # KubeRay runs Ray as the `ray` user; the Serve app is mounted into /home/ray/python.
        RUN useradd -m -s /bin/bash ray && mkdir -p /home/ray/python && chown -R ray:ray /home/ray
        USER ray
        WORKDIR /home/ray
        # /opt/conda/... is the Neuron DLC's site-packages (absent, and ignored, on GPU).
        ENV PYTHONPATH="/opt/conda/lib/python3.13/site-packages:/home/ray/python:$PYTHONPATH"
        # KubeRay sets the container command (ray start ...); drop vLLM's ENTRYPOINT.
        ENTRYPOINT []
        EOF
      - docker build --build-arg SOURCE_IMAGE="$SOURCE_IMAGE" --build-arg RAY_VERSION="$RAY_VERSION" -t $RAY_IMAGE .
  post_build:
    commands:
      - docker push $RAY_IMAGE
