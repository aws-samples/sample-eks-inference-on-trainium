apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: x86-cpu-karpenter
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - name: ${x86_ami_name}
  # Local NVMe (the pool only launches instance types that have it), striped
  # and used for the kubelet's ephemeral storage and containerd's images: the
  # weights, a compile's local cache and the multi-GB serving image all land on
  # NVMe instead of the EBS root volume.
  instanceStorePolicy: RAID0
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        deleteOnTermination: true
        encrypted: true
        volumeSize: 100Gi
        volumeType: gp3
  detailedMonitoring: true
  role: "${node_role}"
  # Only the node security group, like the managed node group: the EKS cluster
  # security group carries the same kubernetes.io/cluster tag, and the AWS Load
  # Balancer Controller won't register pods whose ENI has two tagged groups.
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${name}"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${name}"
        kubernetes.io/role/internal-elb: "1"
  tags:
    karpenter.sh/discovery: "${name}"
    # Exempt from the account's SpringClean auto-stop/delete sweep (see eks.tf).
    auto-stop: "no"
    auto-delete: "no"
