version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - |
        cat > Dockerfile << 'EOF'
        # BASE_IMAGE (vLLM-Neuron DLC) and RAY_VERSION come from CodeBuild env vars,
        # which Terraform sets from locals (main.tf). Those same two versions compose
        # the image tag, so the tag always matches what's installed. Ray must match
        # rayVersion in ray/ray-service-trn2.yaml (2.56.1: py3.13 wheels + KubeRay 1.7.x).
        ARG BASE_IMAGE
        FROM ${BASE_IMAGE}

        ARG RAY_VERSION

        USER root

        RUN pip install ray[serve]==${RAY_VERSION}

        # Create ray user and directories
        RUN useradd -m -s /bin/bash ray && \
            mkdir -p /home/ray/python && \
            chown -R ray:ray /home/ray

        USER ray
        WORKDIR /home/ray

        # Set environment variables
        ENV PYTHONPATH="/opt/conda/lib/python3.13/site-packages:/home/ray/python:$PYTHONPATH"
        ENV LD_LIBRARY_PATH="/home/ray/anaconda3/lib:$LD_LIBRARY_PATH"

        EXPOSE 8000 8265 10001 6379

        CMD ["ray", "start", "--head", "--dashboard-host=0.0.0.0", "--dashboard-port=8265"]
        EOF
      - docker build --build-arg BASE_IMAGE="$BASE_IMAGE" --build-arg RAY_VERSION="$RAY_VERSION" -t $IMAGE_REPO_NAME:$IMAGE_TAG .
      - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image...
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
