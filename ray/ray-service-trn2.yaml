# Manual path: RayService for gpt-oss-20b on Neuron (no validated serving
# profiles). Head on the x86 pool, one worker on a trn2.3xlarge (1 device = 4
# logical NeuronCores, TP4). The worker pulls the model dir from S3 (weights +
# the shared cache/ = VLLM_CACHE_ROOT); graphs not already cached compile on first
# start into the node's NVMe. Same serve config + cache dir as
# vllm/vllm-gpt-oss-20b-trn2-3xl.yaml, so the two share the cache.
#
#   kubectl create configmap gpt-oss-20b-vllm-script --from-file=gpt_oss_20b_vllm.py=ray/gpt_oss_20b_vllm.py --dry-run=client -o yaml | kubectl apply -f -
#   envsubst '$CUSTOM_RAY_VLLM_IMAGE $S3_BUCKET_NAME $AWS_REGION' < ray/ray-service-trn2.yaml | kubectl apply -f -
apiVersion: ray.io/v1
kind: RayService
metadata:
  name: ray-gpt-oss-20b
  namespace: default
spec:
  serviceUnhealthySecondThreshold: 1800
  deploymentUnhealthySecondThreshold: 1800
  serveConfigV2: |
    applications:
      - name: gpt-oss-20b-vllm
        import_path: "gpt_oss_20b_vllm:deployment"
        route_prefix: "/"
        deployments:
          - name: gpt-oss-20b-vllm-deployment
            autoscaling_config:
              min_replicas: 1
              max_replicas: 1
              target_num_ongoing_requests_per_replica: 20
  rayClusterConfig:
    rayVersion: '2.56.1'
    enableInTreeAutoscaling: true
    headGroupSpec:
      rayStartParams:
        dashboard-host: '0.0.0.0'
        num-cpus: "0" # this is to ensure no tasks or actors are scheduled on the head Pod
        num-gpus: "0"
      template:
        metadata:
          labels:
            ray.io/node-type: head
        spec:
          containers:
          - name: head
            image: $CUSTOM_RAY_VLLM_IMAGE
            imagePullPolicy: IfNotPresent
            lifecycle:
              preStop:
                exec:
                  command: ["/bin/sh", "-c", "ray stop"]
            ports:
            - containerPort: 6379
              name: gcs
            - containerPort: 8265
              name: dashboard
            - containerPort: 10001
              name: client
            - containerPort: 8000
              name: serve
            - containerPort: 52365
              name: dashboard-agent
            volumeMounts:
            - mountPath: /tmp/ray
              name: ray-logs
            - name: vllm-script
              mountPath: /home/ray/python/gpt_oss_20b_vllm.py
              subPath: gpt_oss_20b_vllm.py
            resources:
              limits:
                cpu: 4
                memory: "16G"
              requests:
                cpu: 4
                memory: "16G"
            env:
            - name: PYTHONPATH
              value: "/opt/conda/lib/python3.13/site-packages:/home/ray/python:$PYTHONPATH"
            - name: VLLM_PORT
              value: "8004"
            - name: PORT
              value: "8000"
            # Serve app config - the deployment graph is built on the head (Serve
            # controller imports the app), so gpt_oss_20b_vllm.py reads these here.
            # Must match the worker values.
            - name: MODEL_ID
              value: "/tmp/models/gpt-oss-20b"
            - name: TENSOR_PARALLEL_SIZE
              value: "4"
            - name: MAX_NUM_SEQS
              value: "4"
            - name: MAX_NUM_BATCHED_TOKENS
              value: "8192"
            - name: MAX_MODEL_LEN
              value: "16384"
            - name: HF_OVERRIDES
              value: '{"quantization_config": {}}'
            - name: ADDITIONAL_CONFIG
              value: '{"neuron_config":{"num_batched_tokens_buckets":[8192],"num_seqs_buckets":[4]}}'
            - name: RAY_memory_monitor_refresh_ms
              value: "0"  # Disable memory monitor
            - name: RAY_memory_usage_threshold
              value: "0.95" # Set memory threshold
          nodeSelector:
            # Pin the Ray head to the general-purpose x86 Karpenter NodePool.
            karpenter.sh/nodepool: x86-cpu-karpenter
          tolerations:
          - key: "karpenter"
            operator: "Exists"
            effect: "NoSchedule"
          volumes:
          - name: ray-logs
            emptyDir: {}
          - name: vllm-script
            configMap:
              name: gpt-oss-20b-vllm-script
    workerGroupSpecs:
    - replicas: 1
      minReplicas: 1
      maxReplicas: 1
      groupName: worker-group
      rayStartParams:
        resources: '"{\"neuron_cores\": 4}"'
      template:
        metadata:
          labels:
            ray.io/node-type: worker
        spec:
          serviceAccountName: model-reader
          affinity:
            podAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                    - key: ray.io/node-type
                      operator: In
                      values:
                      - head
                  topologyKey: kubernetes.io/zone
          initContainers:
          - name: model-download
            image: amazon/aws-cli
            command: ["/bin/bash", "-c"]
            args:
              - |
                set -e
                # sync (CRT) reconciles against S3: warm NVMe -> transfers nothing,
                # fresh node -> full pull, partial -> just the gap. Weights + cache/.
                aws configure set s3.preferred_transfer_client crt
                aws s3 sync "s3://${S3_BUCKET_NAME}/gpt-oss-20b/" /tmp/models/gpt-oss-20b/
                # This init container runs as root, but the Ray worker runs as the
                # non-root `ray` user, and the plugin writes NEFFs / lock files into
                # VLLM_CACHE_ROOT (inside the model dir) - make it writable by the ray user.
                mkdir -p /tmp/models/gpt-oss-20b/cache
                chmod -R a+rwX /tmp/models/gpt-oss-20b
                ls -la /tmp/models/gpt-oss-20b/
            env:
              - name: AWS_REGION
                value: ${AWS_REGION}
            volumeMounts:
              - name: local-storage
                mountPath: /tmp/models
          containers:
          - name: worker
            image: $CUSTOM_RAY_VLLM_IMAGE
            imagePullPolicy: IfNotPresent
            lifecycle:
              preStop:
                exec:
                  command: ["/bin/sh", "-c", "ray stop"]
            volumeMounts:
            - mountPath: /tmp/ray
              name: ray-logs
            - name: vllm-script
              mountPath: /home/ray/python/gpt_oss_20b_vllm.py
              subPath: gpt_oss_20b_vllm.py
            - name: local-storage
              mountPath: /tmp/models
            - mountPath: /dev/shm
              name: dshm
            resources:
              # The trn2.3xlarge's single device (4 logical NeuronCores); cpu/memory
              # stay below the node's allocatable (12 vCPU / 128 GiB) so it schedules.
              limits:
                cpu: 10
                memory: "112Gi"
                aws.amazon.com/neuron: "1"
              requests:
                cpu: 10
                memory: "112Gi"
                aws.amazon.com/neuron: "1"
            env:
            # Model and serve configuration (must match the head).
            - name: MODEL_ID
              value: "/tmp/models/gpt-oss-20b"
            - name: MAX_MODEL_LEN
              value: "16384"
            - name: MAX_NUM_SEQS
              value: "4"
            - name: MAX_NUM_BATCHED_TOKENS
              value: "8192"
            - name: TENSOR_PARALLEL_SIZE
              value: "4"
            - name: HF_OVERRIDES
              value: '{"quantization_config": {}}'
            - name: ADDITIONAL_CONFIG
              value: '{"neuron_config":{"num_batched_tokens_buckets":[8192],"num_seqs_buckets":[4]}}'
            - name: NEURON_CORES
              value: "4" # NeuronCores used by the deployment (TP4)
            - name: NEURON_RT_ASYNC_EXEC
              value: "1" # Enable asynchronous execution
            - name: NEURON_RT_NUM_CORES
              value: "4" # Total number of Neuron cores available to the runtime
            # trn2 nodes here have no EFA; EFA affinity is a CPU perf hint, not
            # required for single-instance TP (collectives use NeuronLink).
            - name: NEURON_SKIP_EFA_AFFINITY
              value: "1"
            # gpt-oss needs long compile/execute timeouts (first start compiles).
            - name: VLLM_NEURON_COMPILATION_TIMEOUT
              value: "1200"
            - name: VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS
              value: "1200"
            # Compile cache inside the model dir (mirrors s3://<bucket>/gpt-oss-20b/cache/);
            # shared with the vLLM manifest.
            - name: VLLM_CACHE_ROOT
              value: "/tmp/models/gpt-oss-20b/cache"
            # system path
            - name: PYTHONPATH
              value: "/opt/conda/lib/python3.13/site-packages:/home/ray/python:$PYTHONPATH"
            - name: VLLM_PORT
              value: "8004"
            - name: PORT
              value: "8000"
            # ray
            - name: RAY_gcs_server_request_timeout_seconds
              value: "180"
            - name: RAY_SERVE_KV_TIMEOUT_S
              value: "180"
            - name: RAY_memory_monitor_refresh_ms
              value: "0"  # Disable memory monitor
            - name: RAY_memory_usage_threshold
              value: "0.95" # Set memory threshold
          nodeSelector:
            # Pin to the neuron-trn2-3xl Karpenter NodePool by name.
            karpenter.sh/nodepool: neuron-trn2-3xl
          tolerations:
          - key: "aws.amazon.com/neuron"
            operator: "Exists"
            effect: "NoSchedule"
          - key: "karpenter"
            operator: "Exists"
            effect: "NoSchedule"
          volumes:
          - name: dshm
            emptyDir:
              medium: Memory
          - name: ray-logs
            emptyDir: {}
          - name: vllm-script
            configMap:
              name: gpt-oss-20b-vllm-script
          - name: local-storage
            hostPath:
              path: /mnt/k8s-disks/0
              type: Directory
