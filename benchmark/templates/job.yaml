{{- if .Values.benchmark.enabled }}
{{- $root := . }}
{{- $b := .Values.benchmark }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "benchmark.fullname" $root }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "benchmark.labels" $root | nindent 4 }}
    app.kubernetes.io/component: benchmark
spec:
  backoffLimit: {{ $b.job.backoffLimit }}
  ttlSecondsAfterFinished: {{ $b.job.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "benchmark.labels" $root | nindent 8 }}
        app.kubernetes.io/component: benchmark
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $b.serviceAccount }}
      {{- if $b.affinity.enabled }}
      # Soft preference: co-locate in the same zone as the inference pods.
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  {{- range $k, $v := $b.affinity.targetLabels }}
                  {{ $k }}: {{ $v }}
                  {{- end }}
              topologyKey: topology.kubernetes.io/zone
      {{- end }}
      # Tolerate Neuron and Karpenter taints so the pod can land on any node.
      tolerations:
      - key: aws.amazon.com/neuron
        operator: Exists
        effect: NoSchedule
      - key: karpenter
        operator: Exists
        effect: NoSchedule
      containers:
      - name: inference-perf
        image: {{ $b.image.repository }}:{{ $b.image.tag }}
        imagePullPolicy: {{ $b.image.pullPolicy }}
        command: ["/bin/sh", "-c"]
        args:
        - |
          {{- if $b.dependencies.packages }}
          echo "Installing dependencies..."
          pip install --no-cache-dir \
          {{- range $b.dependencies.packages }}
            {{ . | quote }} \
          {{- end }}
            && echo "Dependencies installed"
          {{- end }}
          # Run each enabled test SEQUENTIALLY in the order below, so the latency
          # test measures with zero competing load before the throughput/chat
          # sweeps saturate the endpoint. A test is run only if its config exists.
          set -e
          for t in {{ range $b.runOrder }}{{ . }} {{ end }}; do
            cfg="/workspace/configs/config-$t.yml"
            [ -f "$cfg" ] || continue
            echo "=========================================="
            echo "TEST: $t   target: {{ $b.target.label }} @ {{ $b.target.baseUrl }}"
            echo "=========================================="
            inference-perf --config_file "$cfg"
          done
          echo "All benchmark tests complete."
        env:
        - name: TOKENIZERS_PARALLELISM
          value: "false"
        volumeMounts:
        - name: configs
          mountPath: /workspace/configs
        resources:
          {{- toYaml $b.resources | nindent 10 }}
      volumes:
      - name: configs
        configMap:
          name: {{ include "benchmark.fullname" $root }}
{{- end }}
