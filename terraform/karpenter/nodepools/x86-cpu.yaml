apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: x86-cpu-karpenter
spec:
  # Dynamic, on-demand x86 capacity for CPU work: the model-weights Job and the
  # Ray head. Karpenter launches a node when a pod needs one and consolidates it
  # away when it's empty.
  template:
    metadata:
      labels:
        instanceType: mixed-x86
        provisionerType: Karpenter
    spec:
      taints:
        - key: karpenter
          value: "true"
          effect: "NoSchedule"
      requirements:
        - key: "karpenter.k8s.aws/instance-family"
          operator: In
          values: ["c5", "m5", "r5"]
        - key: "karpenter.k8s.aws/instance-size"
          operator: In
          values: ["4xlarge", "8xlarge"]
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["on-demand"]
      expireAfter: 720h
      terminationGracePeriod: 24h
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: x86-cpu-karpenter
  limits:
    cpu: 128
    memory: 512Gi
  disruption:
    consolidateAfter: 300s
    consolidationPolicy: WhenEmptyOrUnderutilized
