# RayService for gpt-oss-20b, TP4 on 1 Trainium2 device (4 logical NeuronCores),
# on any trn2 size: Ray head on the x86 pool, one worker on a Trainium node. The worker claims its device through the Neuron DRA driver (the
# ResourceClaimTemplate below) and pulls the weights from S3. ENGINE_ARGS below
# are values-gpt-oss-trn2-tp4.yaml's engine flags. Its compiled graphs live in
# the shared Neuron cache (EFS), in this image's own folder (NEURON_CACHE_KEY,
# the vllm-serving chart's cache key scheme applied to $RAY_NEURON_IMAGE): the
# first start compiles them all on Trainium, and later starts reuse them.
#
#   kubectl create configmap vllm-ray-app --from-file=ray/vllm_ray_app.py --dry-run=client -o yaml | kubectl apply -f -
#   export NEURON_CACHE_KEY=$(printf %s "$RAY_NEURON_IMAGE" | shasum | cut -c1-10)
#   envsubst '$RAY_NEURON_IMAGE $S3_BUCKET_NAME $AWS_REGION $NEURON_CACHE_KEY' < ray/ray-service-gpt-oss-trn2-tp4.yaml | kubectl apply -f -
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpt-oss-trn2-tp4-ray-devices
  namespace: default
spec:
  spec:
    devices:
      requests:
        - name: devices
          exactly:
            deviceClassName: neuron.aws.com
            allocationMode: ExactCount
            count: 1
---
apiVersion: ray.io/v1
kind: RayService
metadata:
  name: gpt-oss-trn2-tp4-ray
  namespace: default
spec:
  # The first start compiles every graph on Trainium before the app is healthy:
  # allow it up to 3 h before KubeRay restarts the cluster.
  serviceUnhealthySecondThreshold: 10800
  deploymentUnhealthySecondThreshold: 10800
  serveConfigV2: |
    applications:
      - name: gpt-oss-20b
        import_path: "vllm_ray_app:deployment"
        route_prefix: "/"
  rayClusterConfig:
    rayVersion: '2.56.1'
    headGroupSpec:
      rayStartParams:
        dashboard-host: '0.0.0.0'
        num-cpus: "0" # this is to ensure no tasks or actors are scheduled on the head Pod
        num-gpus: "0"
      template:
        metadata:
          labels:
            ray.io/node-type: head
        spec:
          containers:
          - name: head
            image: $RAY_NEURON_IMAGE
            imagePullPolicy: IfNotPresent
            lifecycle:
              preStop:
                exec:
                  command: ["/bin/sh", "-c", "ray stop"]
            ports:
            - containerPort: 6379
              name: gcs
            - containerPort: 8265
              name: dashboard
            - containerPort: 10001
              name: client
            - containerPort: 8000
              name: serve
            - containerPort: 52365
              name: dashboard-agent
            # Scraped by the ray-head PodMonitor (terraform/scrape-configs): autoscaler
            # and dashboard metrics on Ray's default ports. KubeRay adds `metrics` (8080).
            - containerPort: 44217
              name: as-metrics
            - containerPort: 44227
              name: dash-metrics
            volumeMounts:
            - mountPath: /tmp/ray
              name: ray-logs
            - name: vllm-ray-app
              mountPath: /home/ray/python/vllm_ray_app.py
              subPath: vllm_ray_app.py
            resources:
              limits:
                cpu: 4
                memory: "16G"
              requests:
                cpu: 4
                memory: "16G"
            env:
            - name: PYTHONPATH
              value: "/opt/conda/lib/python3.14/site-packages:/home/ray/python:$PYTHONPATH"
            - name: VLLM_PORT
              value: "8004"
            - name: PORT
              value: "8000"
            # The Serve controller imports the app on the head to build the
            # deployment graph, so vllm_ray_app.py reads these here too. Must
            # match the worker values. (The engine flags are only read on the worker.)
            - name: MODEL_ID
              value: "/tmp/models/gpt-oss-20b"
            - name: NEURON_CORES
              value: "4"
            - name: RAY_memory_monitor_refresh_ms
              value: "0"  # Disable memory monitor
            - name: RAY_memory_usage_threshold
              value: "0.95" # Set memory threshold
          nodeSelector:
            # Pin the Ray head to the general-purpose x86 Karpenter NodePool.
            karpenter.sh/nodepool: x86-cpu-karpenter
          tolerations:
          - key: "karpenter"
            operator: "Exists"
            effect: "NoSchedule"
          volumes:
          - name: ray-logs
            emptyDir: {}
          - name: vllm-ray-app
            configMap:
              name: vllm-ray-app
    workerGroupSpecs:
    - replicas: 1
      minReplicas: 1
      maxReplicas: 1
      groupName: worker-group
      rayStartParams:
        resources: '"{\"neuron_cores\": 4}"'
      template:
        metadata:
          labels:
            ray.io/node-type: worker
        spec:
          serviceAccountName: s3-reader
          resourceClaims:
          - name: devices
            resourceClaimTemplateName: gpt-oss-trn2-tp4-ray-devices
          affinity:
            podAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                    - key: ray.io/node-type
                      operator: In
                      values:
                      - head
                  topologyKey: kubernetes.io/zone
          initContainers:
          - name: model-download
            image: amazon/aws-cli
            command: ["/bin/bash", "-c"]
            args:
              - |
                set -e
                # sync (CRT) reconciles against S3: warm NVMe -> transfers nothing,
                # fresh node -> full pull, partial -> just the gap. Weights only.
                aws configure set s3.preferred_transfer_client crt
                aws s3 sync "s3://${S3_BUCKET_NAME}/gpt-oss-20b/" /tmp/models/gpt-oss-20b/ --exclude ".ready/*" --exclude "cache*" --exclude "original/*" --exclude "metal/*"
                mkdir -p /tmp/models/gpt-oss-20b/cache
                ls -la /tmp/models/gpt-oss-20b/
            env:
              - name: AWS_REGION
                value: ${AWS_REGION}
            volumeMounts:
              - name: local-storage
                mountPath: /tmp/models
          containers:
          - name: worker
            image: $RAY_NEURON_IMAGE
            imagePullPolicy: IfNotPresent
            # Root, like the vllm-serving chart's pods: the Neuron cache writes the
            # NEFFs on EFS readable by their owner only (0600), as root.
            securityContext:
              runAsUser: 0
              runAsGroup: 0
            lifecycle:
              preStop:
                exec:
                  command: ["/bin/sh", "-c", "ray stop"]
            volumeMounts:
            - mountPath: /tmp/ray
              name: ray-logs
            - name: vllm-ray-app
              mountPath: /home/ray/python/vllm_ray_app.py
              subPath: vllm_ray_app.py
            - name: local-storage
              mountPath: /tmp/models
            - mountPath: /dev/shm
              name: dshm
            - name: neuron-cache
              mountPath: /neuron-cache
            # The traced graphs (the plugin's precompile cache) the warmup Job
            # saved, where the plugin reads them (<VLLM_CACHE_ROOT>/neuron/torch_compile),
            # as the vllm-serving chart mounts them: without them the worker
            # re-traces and recompiles every graph.
            - name: neuron-cache
              mountPath: /tmp/models/gpt-oss-20b/cache/neuron/torch_compile
              subPath: ${NEURON_CACHE_KEY}/torch-compile
            resources:
              # One Trainium2 device (4 logical NeuronCores), from the DRA claim;
              # cpu/memory are one device's share (a trn2.3xlarge: 12 vCPU / 128 GiB).
              limits:
                cpu: 10
                memory: "112Gi"
              requests:
                cpu: 10
                memory: "112Gi"
              claims:
              - name: devices
            env:
            # Model (must match the head) and engine flags: values-gpt-oss-trn2-tp4.yaml's,
            # as the vllm-serving chart renders them.
            - name: MODEL_ID
              value: "/tmp/models/gpt-oss-20b"
            - name: ENGINE_ARGS
              value: '["--tokenizer", "/tmp/models/gpt-oss-20b", "--tensor-parallel-size=4", "--max-model-len=8192", "--max-num-seqs=32", "--max-num-batched-tokens=512", "--no-enable-prefix-caching", "--no-disable-hybrid-kv-cache-manager", "--hf-overrides={\"quantization_config\": {}}", "--additional-config={\"neuron_config\": {\"decode_context_length_buckets\": [512, 1024, 2048, 4096]}}"]'
            # Shared Neuron cache on EFS, as the vllm-serving chart sets it: LNC 2,
            # the trn2 target, native NEFFs and XLA/NKI graphs, under the chart's
            # cache key for this image (NEURON_CACHE_KEY).
            - name: NEURON_LOGICAL_NC_CONFIG
              value: "2"
            - name: NEURON_PLATFORM_TARGET_OVERRIDE
              value: trn2
            - name: VLLM_NEURON_BACKEND
              value: neuron_native
            - name: TORCH_NEURONX_NEFF_CACHE_DIR
              value: /neuron-cache/${NEURON_CACHE_KEY}/native-neff
            - name: NEURON_LIBTORCH_REMOTE_CACHE
              value: /neuron-cache/${NEURON_CACHE_KEY}/xla
            - name: NEURON_CORES
              value: "4" # NeuronCores each replica claims (TP4)
            - name: NEURON_RT_ASYNC_EXEC
              value: "1" # Enable asynchronous execution
            - name: NEURON_RT_NUM_CORES
              value: "4" # Total number of Neuron cores available to the runtime
            # trn2 nodes here have no EFA; EFA affinity is a CPU perf hint, not
            # required for single-instance TP (collectives use NeuronLink).
            - name: NEURON_SKIP_EFA_AFFINITY
              value: "1"
            # Same timeouts as values-gpt-oss-trn2-tp4.yaml.
            - name: VLLM_NEURON_COMPILATION_TIMEOUT
              value: "1200"
            # Parallel neuronx-cc processes when compiling at startup: few enough
            # to fit the worker's 112Gi (the chart's CPU compile uses 16 on 240Gi).
            - name: NEURON_LIBTORCH_PARALLEL_COMPILE_WORKERS
              value: "4"
            - name: VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS
              value: "1200"
            # vLLM cache inside the model dir, on the node NVMe (its neuron/torch_compile is the EFS precompile cache, mounted above).
            - name: VLLM_CACHE_ROOT
              value: "/tmp/models/gpt-oss-20b/cache"
            # system path
            - name: PYTHONPATH
              value: "/opt/conda/lib/python3.14/site-packages:/home/ray/python:$PYTHONPATH"
            - name: VLLM_PORT
              value: "8004"
            - name: PORT
              value: "8000"
            # ray
            - name: RAY_gcs_server_request_timeout_seconds
              value: "180"
            - name: RAY_SERVE_KV_TIMEOUT_S
              value: "180"
            - name: RAY_memory_monitor_refresh_ms
              value: "0"  # Disable memory monitor
            - name: RAY_memory_usage_threshold
              value: "0.95" # Set memory threshold
          nodeSelector:
            # Any Trainium node (any trn2 size): the device claim decides what fits.
            neuron.amazonaws.com/neuron-device: "true"
          tolerations:
          - key: "aws.amazon.com/neuron"
            operator: "Exists"
            effect: "NoSchedule"
          - key: "karpenter"
            operator: "Exists"
            effect: "NoSchedule"
          volumes:
          - name: dshm
            emptyDir:
              medium: Memory
          - name: ray-logs
            emptyDir: {}
          - name: vllm-ray-app
            configMap:
              name: vllm-ray-app
          - name: local-storage
            hostPath:
              path: /mnt/k8s-disks/0
              type: Directory
          - name: neuron-cache
            persistentVolumeClaim:
              claimName: neuron-cache
