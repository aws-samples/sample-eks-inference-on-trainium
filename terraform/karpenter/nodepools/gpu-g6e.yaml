apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-g6e
spec:
  # Dynamic, on-demand (or Spot) GPU capacity: the g6e family, NVIDIA L40S 48 GB
  # GPUs. Karpenter launches the cheapest size that fits a pod's GPUs, CPU and
  # memory, falling back to a larger one when it's out of capacity, and
  # consolidates the node away when it's empty.
  template:
    metadata:
      labels:
        provisionerType: Karpenter
        nvidia.com/gpu: "true"
        # Where the NVIDIA DRA kubelet plugin runs; set here so it's on the node
        # from boot (the pinned AMI isn't the al2023@latest alias that sets it).
        nvidia.com/gpu.present: "true"
    spec:
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: "NoSchedule"
        - key: karpenter
          value: "true"
          effect: "NoSchedule"
      requirements:
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["g6e"]
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["on-demand", "spot"]
      expireAfter: 720h
      terminationGracePeriod: 24h
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu
  limits:
    nvidia.com/gpu: 4
    cpu: 64
    memory: 512Gi
  disruption:
    consolidateAfter: 300s
    consolidationPolicy: WhenEmptyOrUnderutilized
