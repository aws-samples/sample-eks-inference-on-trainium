apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: neuron-trn1
spec:
  # Static capacity: always keep 1 trn1 node warm (NVMe model cache stays hot,
  # serving pods get an instant local hit). Static nodes are not consolidated.
  replicas: 1
  template:
    metadata:
      labels:
        instanceType: trn1.2xlarge
        provisionerType: Karpenter
        neuron.amazonaws.com/neuron-device: "true"
    spec:
      taints:
        - key: aws.amazon.com/neuron
          value: "true"
          effect: "NoSchedule"
        - key: karpenter
          value: "true"
          effect: "NoSchedule"
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["trn1.2xlarge"]
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["on-demand"]
      expireAfter: 720h
      terminationGracePeriod: 24h
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: neuron
  # Static mode allows only the `nodes` limit. Set to 2 for headroom so an
  # expiring/drifting node can be replaced without dropping below 1.
  limits:
    nodes: 2
