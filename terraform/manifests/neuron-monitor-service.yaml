apiVersion: v1
kind: Service
metadata:
  name: neuron-monitor
  namespace: monitoring
  labels:
    app: neuron-monitor
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9010"
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9010
      protocol: TCP
  selector:
    app: neuron-monitor
