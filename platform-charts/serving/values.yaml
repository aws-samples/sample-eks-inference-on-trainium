# Default values for the serving chart (used by model users).
#
# Define one or more endpoints; each picks a profile the platform publishes and
# an engine. Everything else (image, node pool, devices, engine flags, S3 paths)
# comes from the profile, so each endpoint matches its profile's precompiled NEFFs.
#
#   kubectl get cm -l serving.platform/profile -L serving.platform/hardware,serving.platform/nodepool
#   helm install gpt-oss platform-charts/serving --set endpoints.gpt-oss.profile=trn2-tp4-16k
#   helm install gpt-oss platform-charts/serving -f my-endpoints.yaml
#
# Profiles are read from the cluster at install/upgrade time (Helm `lookup`), so
# `helm template` / `--dry-run=client` can't render this chart.

# Namespace the platform publishes profiles in (default: release namespace).
platformNamespace: ""

# Settings every endpoint inherits; any of these can be overridden per endpoint.
defaults:
  # vllm: standalone vLLM Deployment + Service (OpenAI API on vllm.port)
  # ray:  RayService (Ray Serve, OpenAI API on ray.port); Neuron profiles only
  engine: vllm

  # Fail the install unless the profile's compile Job has completed (NEFFs in
  # S3). When false, an uncompiled profile still serves but compiles at startup.
  requirePrecompiled: false

  # Override profile env (engine flags) - takes the endpoint off-profile, so
  # vLLM-Neuron recompiles at startup (gpt-oss: 20-40 min). Requires
  # allowOffProfile=true.
  allowOffProfile: false
  overrides: {}

  # Extra env that doesn't change the engine config (logging, tuning).
  env:
    VLLM_LOGGING_LEVEL: INFO
    MALLOC_ARENA_MAX: "1"

  vllm:
    replicas: 1
    port: 8080

  ray:
    port: 8000
    head:
      nodepool: x86-cpu-karpenter
      resources:
        cpu: 4
        memory: 16G

# Endpoints, keyed by name (the Service / Deployment / RayService name: lowercase
# letters, digits and '-', max 40 chars). Each needs `profile`; anything from
# `defaults` can be overridden. Endpoints on the same NodePool compete for its
# nodes - with a single reserved node, only one of them schedules at a time.
endpoints: {}
