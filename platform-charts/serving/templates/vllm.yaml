{{- range $e := include "serving.endpoints" . | fromJsonArray }}
{{- $ctx := dict "root" $ "name" $e.name "ep" $e.ep }}
{{- if eq $ctx.ep.engine "vllm" }}
{{- $r := include "serving.profile" $ctx | fromJson }}
{{- $spec := $r.spec }}
{{- $name := $ctx.name }}
---
# Standalone vLLM (no Ray): OpenAI-compatible API on vllm.port, launched with the
# platform's vended serve script and the profile env.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "serving.labels" $ctx | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/app-metrics: "true"
    prometheus.io/port: {{ $ctx.ep.vllm.port | quote }}
spec:
  ports:
    - name: http
      port: {{ $ctx.ep.vllm.port }}
      protocol: TCP
      targetPort: http
  selector:
    {{- include "serving.selectorLabels" $ctx | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "serving.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ $ctx.ep.vllm.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "serving.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "serving.labels" $ctx | nindent 8 }}
      annotations:
        # Roll pods when the pinned profile env / scripts change.
        checksum/profile: {{ toJson $r | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: {{ $spec.serviceAccount }}
      nodeSelector:
        karpenter.sh/nodepool: {{ $spec.nodepool }}
      tolerations:
        {{- toYaml $spec.tolerations | nindent 8 }}
      initContainers:
        {{- include "serving.modelDownload" (dict "ctx" $ctx "spec" $spec) | nindent 8 }}
      containers:
        - name: vllm
          image: {{ $spec.image }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/opt/vllm/serve.sh"]
          ports:
            - containerPort: {{ $ctx.ep.vllm.port }}
              protocol: TCP
              name: http
          # Readiness only (no liveness) - Ready when vLLM's /health responds,
          # i.e. after the model loads (+ compiles, on a cache miss). No liveness
          # probe on purpose, so a slow warmup never restarts the pod.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            {{- include "serving.resources" $spec | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ $name }}-env
          env:
            - name: PORT
              value: {{ $ctx.ep.vllm.port | quote }}
            {{- range $k, $v := $ctx.ep.env }}
            - name: {{ $k }}
              value: {{ $v | toString | quote }}
            {{- end }}
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: local-storage
              mountPath: {{ $spec.modelsPath }}
            - name: scripts
              mountPath: /opt/vllm
      terminationGracePeriodSeconds: 10
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
        - name: local-storage
          hostPath:
            path: {{ $spec.nodeLocalPath }}
            type: Directory
        - name: scripts
          configMap:
            name: {{ $name }}-scripts
{{- end }}
{{- end }}
