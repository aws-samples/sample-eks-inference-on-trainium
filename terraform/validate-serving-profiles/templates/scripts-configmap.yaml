# Vended launch scripts: vllm-serve.sh (compile Jobs + vLLM serving) and the Ray
# Serve app (RayService). Both build the engine config from the profile env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-serve-script
  labels:
    {{- include "platform.labels" . | nindent 4 }}
data:
  serve.sh: |-
    {{- .Files.Get "files/vllm-serve.sh" | nindent 4 }}
  vllm_ray_app.py: |-
    {{- .Files.Get "files/vllm_ray_app.py" | nindent 4 }}
