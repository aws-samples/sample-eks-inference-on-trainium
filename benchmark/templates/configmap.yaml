{{- if .Values.benchmark.enabled }}
{{- $root := . }}
{{- $b := .Values.benchmark }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "benchmark.fullname" $root }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "benchmark.labels" $root | nindent 4 }}
data:
  {{- range $test, $cfg := $b.tests }}
  {{- if $cfg.enabled }}
  config-{{ $test }}.yml: |
    {{- include "benchmark.config" (dict "b" $b "cfg" $cfg "test" $test) | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
