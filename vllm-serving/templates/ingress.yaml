{{- include "vllm-serving.validate" . }}
{{- if and (eq .Values.mode "serve") .Values.ingress.enabled }}
{{- $i := .Values.ingress }}
# Internal ALB in front of the Service (AWS Load Balancer Controller): private
# IPs in the private subnets, reachable only from ingress.inboundCidrs (the VPC
# by default). The scheme is fixed to internal; vLLM has no auth of its own.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "vllm-serving.labels" . | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/inbound-cidrs: {{ $i.inboundCidrs | quote }}
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds={{ $i.idleTimeoutSeconds }}
    {{- if $i.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ $i.certificateArn }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    {{- else }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    {{- end }}
    {{- with $i.groupName }}
    alb.ingress.kubernetes.io/group.name: {{ . }}
    {{- end }}
spec:
  ingressClassName: alb
  rules:
    - {{- with $i.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  name: http
{{- end }}
