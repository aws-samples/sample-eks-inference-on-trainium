# Default values for the benchmark chart.
#
# One release benchmarks one endpoint: `helm upgrade --install bench-<endpoint>
# benchmark/ -f benchmark/values-<endpoint>.yaml`. Its Job runs the tests
# sequentially (runOrder). Everything here is shared by every endpoint; the
# endpoint file only sets the target (and, for small nodes, the load), so a diff
# of two endpoint files shows exactly what differs between runs.

benchmark:
  image:
    repository: quay.io/inference-perf/inference-perf
    tag: v0.6.1
    pullPolicy: IfNotPresent

  # model-uploader: EKS Pod Identity with S3 read+write on the model bucket,
  # where results are stored (model-reader is read-only).
  serviceAccount: model-uploader

  job:
    backoffLimit: 0
    ttlSecondsAfterFinished: 86400

  # ---- Endpoint under test (set by the endpoint file) ----------------------------
  # label     : results path segment (use the endpoint's Helm release name,
  #             e.g. gpt-oss-20b-trn2-48xl).
  # baseUrl   : in-cluster URL of the endpoint (vllm-serving Service, port 8080).
  # hourlyUsd : the node's $/hr (Capacity Block or On-Demand price) for the
  #             cost/performance metric. Stored with the results.
  target:
    label: ""
    baseUrl: ""
    hourlyUsd: 0

  # ---- Shared by every endpoint -------------------------------------------------
  # modelName : the served model id (= model dir on the node).
  # tokenizer : HF id, used client-side to count tokens.
  server:
    type: vllm
    modelName: /tmp/models/gpt-oss-20b
    tokenizerPath: openai/gpt-oss-20b

  api:
    type: completion
    streaming: true

  storage:
    s3:
      bucketName: ""            # --set benchmark.storage.s3.bucketName=$S3_BUCKET_NAME
      pathPrefix: benchmarks    # -> benchmarks/<label>/<test>/<run>/

  # Server-side vLLM metrics: inference-perf queries Prometheus for each target's
  # vLLM metrics over the same window and stores them next to the client-side
  # report. Filtered by the target's Service, so endpoints never mix.
  metrics:
    prometheus:
      enabled: true
      url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
      scrapeInterval: 1         # seconds; matches the metrics-enabled ServiceMonitor
      extraFilters: []          # more PromQL label matchers, e.g. ["namespace='default'"]
      perStage: true            # also report server metrics per load stage

  # No extra pip deps needed for the gpt-oss tokenizer (fast tokenizer.json).
  dependencies:
    packages: []

  resources:
    requests:
      cpu: "4"
      memory: 8Gi
    limits:
      cpu: "8"
      memory: 16Gi

  # Benchmark pods run on the x86 pool, never on the accelerator nodes they measure.
  nodeSelector:
    karpenter.sh/nodepool: x86-cpu-karpenter

  # Tests run SEQUENTIALLY inside each target's Job, in this order (disabled
  # tests are skipped). chat-latency first, under zero competing load.
  runOrder:
    - chat-latency
    - chat-throughput

  # ---- The tests ---------------------------------------------------------------
  # Both use the SAME real ShareGPT chat workload (first turn of each
  # conversation as the prompt, generation stops at EOS), read in file order -
  # every endpoint gets the identical prompts in the identical order.
  # ShareGPT auto-downloads from HuggingFace at job start.
  tests:
    # Best-case latency: a constant 1 req/s, far below saturation.
    chat-latency:
      enabled: true
      description: "Best-case TTFT / TPOT on real ShareGPT prompts (1 req/s)"
      data:
        type: shareGPT
      ignoreEos: false
      load:
        type: constant
        numWorkers: 4
        stages:
          - { rate: 1, duration: 60 }

    # Throughput: inference-perf first probes the endpoint (a burst of
    # numRequests over 5 s, measuring how fast it drains), estimates the
    # saturation rate, then runs numStages stages from 1 req/s up to it.
    # Sized for 8 replicas x max_num_seqs 4 = 32 sequences in flight per node:
    # ~2 min probe + 5 x 60 s stages.
    chat-throughput:
      enabled: true
      description: "Latency vs load up to saturation on real ShareGPT prompts (sweep)"
      data:
        type: shareGPT
      ignoreEos: false
      load:
        type: constant
        numWorkers: 8
        sweep:
          type: linear
          numRequests: 200
          timeout: 180
          numStages: 5
          stageDuration: 60
          saturationPercentile: 95
      # Stop the run once the endpoint is past saturation, instead of running
      # the remaining stages against a growing queue: requests unanswered after
      # requestTimeoutSeconds fail, and when at least errorRate of the requests
      # finishing in a windowSeconds window fail, the run ends. Stages completed
      # before that are reported as usual.
      stopAtSaturation:
        enabled: true
        requestTimeoutSeconds: 120
        windowSeconds: 30
        errorRate: 0.5
        minSamples: 10
