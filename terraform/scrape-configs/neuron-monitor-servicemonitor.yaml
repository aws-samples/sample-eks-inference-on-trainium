apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: neuron-monitor
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: ["monitoring"]
  selector:
    matchLabels:
      app: neuron-monitor
  endpoints:
    - port: metrics
      interval: 1s
      scrapeTimeout: 1s
      path: /metrics
      scheme: http
