# RayService for gpt-oss-20b on one p5.4xlarge (1x H100, TP1): Ray head on the
# x86 pool, one worker on the gpu-p5-4xl pool. The worker pulls the model dir
# from S3 (weights; vLLM builds its CUDA graphs at startup into cache/ =
# VLLM_CACHE_ROOT). The engine env below is the Step 1 p5.4xlarge scenario - the
# same values as the vLLM deployment.
#
#   kubectl create configmap vllm-ray-app --from-file=ray/vllm_ray_app.py --dry-run=client -o yaml | kubectl apply -f -
#   envsubst '$RAY_GPU_IMAGE $S3_BUCKET_NAME $AWS_REGION' < ray/ray-service-p5.yaml | kubectl apply -f -
apiVersion: ray.io/v1
kind: RayService
metadata:
  name: gpt-oss-20b-p5-4xl-ray
  namespace: default
spec:
  serviceUnhealthySecondThreshold: 1800
  deploymentUnhealthySecondThreshold: 1800
  serveConfigV2: |
    applications:
      - name: gpt-oss-20b
        import_path: "vllm_ray_app:deployment"
        route_prefix: "/"
  rayClusterConfig:
    rayVersion: '2.56.1'
    headGroupSpec:
      rayStartParams:
        dashboard-host: '0.0.0.0'
        num-cpus: "0" # this is to ensure no tasks or actors are scheduled on the head Pod
        num-gpus: "0"
      template:
        metadata:
          labels:
            ray.io/node-type: head
        spec:
          containers:
          - name: head
            image: $RAY_GPU_IMAGE
            imagePullPolicy: IfNotPresent
            lifecycle:
              preStop:
                exec:
                  command: ["/bin/sh", "-c", "ray stop"]
            ports:
            - containerPort: 6379
              name: gcs
            - containerPort: 8265
              name: dashboard
            - containerPort: 10001
              name: client
            - containerPort: 8000
              name: serve
            - containerPort: 52365
              name: dashboard-agent
            # Scraped by the ray-head PodMonitor (terraform/scrape-configs): autoscaler
            # and dashboard metrics on Ray's default ports. KubeRay adds `metrics` (8080).
            - containerPort: 44217
              name: as-metrics
            - containerPort: 44227
              name: dash-metrics
            volumeMounts:
            - mountPath: /tmp/ray
              name: ray-logs
            - name: vllm-ray-app
              mountPath: /home/ray/python/vllm_ray_app.py
              subPath: vllm_ray_app.py
            resources:
              limits:
                cpu: 4
                memory: "16G"
              requests:
                cpu: 4
                memory: "16G"
            env:
            - name: PYTHONPATH
              value: "/opt/conda/lib/python3.13/site-packages:/home/ray/python:$PYTHONPATH"
            - name: VLLM_PORT
              value: "8004"
            - name: PORT
              value: "8000"
            # The Serve controller imports the app on the head to build the
            # deployment graph, so vllm_ray_app.py reads these here too. Must
            # match the worker values.
            - name: MODEL_ID
              value: "/tmp/models/gpt-oss-20b"
            - name: TENSOR_PARALLEL_SIZE
              value: "1"
            - name: MAX_NUM_SEQS
              value: "1"
            - name: MAX_NUM_BATCHED_TOKENS
              value: "8192"
            - name: MAX_MODEL_LEN
              value: "16384"
            - name: DTYPE
              value: bfloat16
            - name: NUM_GPUS
              value: "1"
            - name: RAY_memory_monitor_refresh_ms
              value: "0"  # Disable memory monitor
            - name: RAY_memory_usage_threshold
              value: "0.95" # Set memory threshold
          nodeSelector:
            # Pin the Ray head to the general-purpose x86 Karpenter NodePool.
            karpenter.sh/nodepool: x86-cpu-karpenter
          tolerations:
          - key: "karpenter"
            operator: "Exists"
            effect: "NoSchedule"
          volumes:
          - name: ray-logs
            emptyDir: {}
          - name: vllm-ray-app
            configMap:
              name: vllm-ray-app
    workerGroupSpecs:
    - replicas: 1
      minReplicas: 1
      maxReplicas: 1
      groupName: worker-group
      rayStartParams:
        num-gpus: "1"
      template:
        metadata:
          labels:
            ray.io/node-type: worker
        spec:
          serviceAccountName: model-reader
          affinity:
            podAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                    - key: ray.io/node-type
                      operator: In
                      values:
                      - head
                  topologyKey: kubernetes.io/zone
          initContainers:
          - name: model-download
            image: amazon/aws-cli
            command: ["/bin/bash", "-c"]
            args:
              - |
                set -e
                # sync (CRT) reconciles against S3: warm NVMe -> transfers nothing,
                # fresh node -> full pull, partial -> just the gap. Weights + cache/.
                aws configure set s3.preferred_transfer_client crt
                aws s3 sync "s3://${S3_BUCKET_NAME}/gpt-oss-20b/" /tmp/models/gpt-oss-20b/ --exclude ".ready/*"
                # This init container runs as root, but the Ray worker runs as the
                # non-root `ray` user, and the plugin writes NEFFs / lock files into
                # VLLM_CACHE_ROOT (inside the model dir) - make it writable by the ray user.
                mkdir -p /tmp/models/gpt-oss-20b/cache
                chmod -R a+rwX /tmp/models/gpt-oss-20b
                ls -la /tmp/models/gpt-oss-20b/
            env:
              - name: AWS_REGION
                value: ${AWS_REGION}
            volumeMounts:
              - name: local-storage
                mountPath: /tmp/models
          containers:
          - name: worker
            image: $RAY_GPU_IMAGE
            imagePullPolicy: IfNotPresent
            lifecycle:
              preStop:
                exec:
                  command: ["/bin/sh", "-c", "ray stop"]
            volumeMounts:
            - mountPath: /tmp/ray
              name: ray-logs
            - name: vllm-ray-app
              mountPath: /home/ray/python/vllm_ray_app.py
              subPath: vllm_ray_app.py
            - name: local-storage
              mountPath: /tmp/models
            - mountPath: /dev/shm
              name: dshm
            resources:
              # The p5.4xlarge's single H100; cpu/memory stay below the node's
              # allocatable (16 vCPU / 256 GiB) so it schedules.
              limits:
                cpu: 12
                memory: "200Gi"
                nvidia.com/gpu: "1"
              requests:
                cpu: 12
                memory: "200Gi"
                nvidia.com/gpu: "1"
            env:
            # Model and serve configuration (must match the head).
            - name: MODEL_ID
              value: "/tmp/models/gpt-oss-20b"
            - name: MAX_MODEL_LEN
              value: "16384"
            - name: MAX_NUM_SEQS
              value: "1"
            - name: MAX_NUM_BATCHED_TOKENS
              value: "8192"
            - name: TENSOR_PARALLEL_SIZE
              value: "1"
            - name: DTYPE
              value: bfloat16
            - name: NUM_GPUS
              value: "1" # GPUs each replica claims (TP1)
            # torch.compile cache inside the model dir.
            - name: VLLM_CACHE_ROOT
              value: "/tmp/models/gpt-oss-20b/cache"
            # system path
            - name: PYTHONPATH
              value: "/opt/conda/lib/python3.13/site-packages:/home/ray/python:$PYTHONPATH"
            - name: VLLM_PORT
              value: "8004"
            - name: PORT
              value: "8000"
            # ray
            - name: RAY_gcs_server_request_timeout_seconds
              value: "180"
            - name: RAY_SERVE_KV_TIMEOUT_S
              value: "180"
            - name: RAY_memory_monitor_refresh_ms
              value: "0"  # Disable memory monitor
            - name: RAY_memory_usage_threshold
              value: "0.95" # Set memory threshold
          nodeSelector:
            # Pin to the gpu-p5-4xl Karpenter NodePool by name.
            karpenter.sh/nodepool: gpu-p5-4xl
          tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"
          - key: "karpenter"
            operator: "Exists"
            effect: "NoSchedule"
          volumes:
          - name: dshm
            emptyDir:
              medium: Memory
          - name: ray-logs
            emptyDir: {}
          - name: vllm-ray-app
            configMap:
              name: vllm-ray-app
          - name: local-storage
            hostPath:
              path: /mnt/k8s-disks/0
              type: Directory
