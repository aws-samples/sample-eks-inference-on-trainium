{{- range $e := include "serving.endpoints" . | fromJsonArray }}
{{- $ctx := dict "root" $ "name" $e.name "ep" $e.ep }}
{{- if eq $ctx.ep.engine "ray" }}
{{- $r := include "serving.profile" $ctx | fromJson }}
{{- $spec := $r.spec }}
{{- $name := $ctx.name }}
{{- $tp := index $r.env "TENSOR_PARALLEL_SIZE" }}
---
# Ray Serve on Neuron: head on the CPU pool, one worker per profile node. The
# serve app is the platform's vended vllm_ray_app.py, configured by profile env.
apiVersion: ray.io/v1
kind: RayService
metadata:
  name: {{ $name }}
  labels:
    {{- include "serving.labels" $ctx | nindent 4 }}
spec:
  serviceUnhealthySecondThreshold: 1800
  deploymentUnhealthySecondThreshold: 1800
  serveConfigV2: |
    applications:
      - name: {{ $name }}
        import_path: "vllm_ray_app:deployment"
        route_prefix: "/"
        deployments:
          - name: vllm
            autoscaling_config:
              min_replicas: 1
              max_replicas: 1
              target_num_ongoing_requests_per_replica: 20
  rayClusterConfig:
    rayVersion: {{ $spec.rayVersion | quote }}
    enableInTreeAutoscaling: true
    headGroupSpec:
      rayStartParams:
        dashboard-host: '0.0.0.0'
        num-cpus: "0" # no tasks or actors on the head Pod
        num-gpus: "0"
      template:
        metadata:
          labels:
            {{- include "serving.labels" $ctx | nindent 12 }}
            ray.io/node-type: head
          annotations:
            checksum/profile: {{ toJson $r | sha256sum | trunc 16 }}
        spec:
          containers:
          - name: head
            image: {{ $spec.rayImage }}
            imagePullPolicy: IfNotPresent
            lifecycle:
              preStop:
                exec:
                  command: ["/bin/sh", "-c", "ray stop"]
            ports:
            - containerPort: 6379
              name: gcs
            - containerPort: 8265
              name: dashboard
            - containerPort: 10001
              name: client
            - containerPort: {{ $ctx.ep.ray.port }}
              name: serve
            - containerPort: 52365
              name: dashboard-agent
            volumeMounts:
            - mountPath: /tmp/ray
              name: ray-logs
            - name: scripts
              mountPath: /home/ray/python/vllm_ray_app.py
              subPath: vllm_ray_app.py
            resources:
              limits:
                {{- toYaml $ctx.ep.ray.head.resources | nindent 16 }}
              requests:
                {{- toYaml $ctx.ep.ray.head.resources | nindent 16 }}
            # The Serve controller imports the app on the head to build the
            # deployment graph, so it needs the profile env too.
            envFrom:
            - configMapRef:
                name: {{ $name }}-env
            env:
            - name: PYTHONPATH
              value: "/opt/conda/lib/python3.13/site-packages:/home/ray/python:$PYTHONPATH"
            - name: VLLM_PORT
              value: "8004"
            - name: PORT
              value: {{ $ctx.ep.ray.port | quote }}
            - name: RAY_memory_monitor_refresh_ms
              value: "0"  # Disable memory monitor
            - name: RAY_memory_usage_threshold
              value: "0.95"
          nodeSelector:
            karpenter.sh/nodepool: {{ $ctx.ep.ray.head.nodepool }}
          tolerations:
          - key: "karpenter"
            operator: "Exists"
            effect: "NoSchedule"
          volumes:
          - name: ray-logs
            emptyDir: {}
          - name: scripts
            configMap:
              name: {{ $name }}-scripts
    workerGroupSpecs:
    - replicas: 1
      minReplicas: 1
      maxReplicas: 1
      groupName: worker-group
      rayStartParams:
        resources: {{ printf "\"{\\\"neuron_cores\\\": %s}\"" $tp | squote }}
      template:
        metadata:
          labels:
            {{- include "serving.labels" $ctx | nindent 12 }}
            ray.io/node-type: worker
          annotations:
            checksum/profile: {{ toJson $r | sha256sum | trunc 16 }}
        spec:
          serviceAccountName: {{ $spec.serviceAccount }}
          affinity:
            podAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                    - key: ray.io/node-type
                      operator: In
                      values:
                      - head
                  topologyKey: kubernetes.io/zone
          initContainers:
            {{- include "serving.modelDownload" (dict "ctx" $ctx "spec" $spec) | nindent 12 }}
          containers:
          - name: worker
            image: {{ $spec.rayImage }}
            imagePullPolicy: IfNotPresent
            lifecycle:
              preStop:
                exec:
                  command: ["/bin/sh", "-c", "ray stop"]
            volumeMounts:
            - mountPath: /tmp/ray
              name: ray-logs
            - name: scripts
              mountPath: /home/ray/python/vllm_ray_app.py
              subPath: vllm_ray_app.py
            - name: local-storage
              mountPath: {{ $spec.modelsPath }}
            - mountPath: /dev/shm
              name: dshm
            resources:
              {{- include "serving.resources" $spec | nindent 14 }}
            envFrom:
            - configMapRef:
                name: {{ $name }}-env
            env:
            - name: NEURON_RT_ASYNC_EXEC
              value: "1"
            - name: PYTHONPATH
              value: "/opt/conda/lib/python3.13/site-packages:/home/ray/python:$PYTHONPATH"
            - name: VLLM_PORT
              value: "8004"
            - name: PORT
              value: {{ $ctx.ep.ray.port | quote }}
            - name: RAY_gcs_server_request_timeout_seconds
              value: "180"
            - name: RAY_SERVE_KV_TIMEOUT_S
              value: "180"
            - name: RAY_memory_monitor_refresh_ms
              value: "0"  # Disable memory monitor
            - name: RAY_memory_usage_threshold
              value: "0.95"
            {{- range $k, $v := $ctx.ep.env }}
            - name: {{ $k }}
              value: {{ $v | toString | quote }}
            {{- end }}
          nodeSelector:
            karpenter.sh/nodepool: {{ $spec.nodepool }}
          tolerations:
            {{- toYaml $spec.tolerations | nindent 12 }}
          volumes:
          - name: dshm
            emptyDir:
              medium: Memory
          - name: ray-logs
            emptyDir: {}
          - name: scripts
            configMap:
              name: {{ $name }}-scripts
          - name: local-storage
            hostPath:
              path: {{ $spec.nodeLocalPath }}
              type: Directory
{{- end }}
{{- end }}
