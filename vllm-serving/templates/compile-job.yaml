{{- if eq .Values.mode "compile" }}
{{- $dir := include "vllm-serving.modelDir" . }}
{{- $s3 := printf "s3://%s/%s" .Values.s3Bucket .Values.model }}
{{- $c := .Values.compile }}
{{- $job := printf "%s-r%d" .Release.Name .Release.Revision | trunc 63 | trimSuffix "-" }}
# AOT compile: build the scenario's vLLM engine on its NodePool and run a short
# `vllm bench latency`. On Neuron, building the engine compiles every graph into
# VLLM_CACHE_ROOT; the short run proves they execute. Then upload the cache and
# the latency result to S3, where every serving pod with the same values pulls it.
# Named <release>-r<revision>: a Job's spec is immutable, so every
# `helm upgrade --install` creates a fresh Job and Helm deletes the previous one
# (as does `helm uninstall`, stopping it if still running). Otherwise a finished
# Job and its pod (logs) stay for compile.jobTtlSeconds.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $job }}
  labels:
    {{- include "vllm-serving.labels" . | nindent 4 }}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: {{ $c.jobTtlSeconds }}
  template:
    metadata:
      labels:
        {{- include "vllm-serving.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccounts.compile }}
      nodeSelector:
        karpenter.sh/nodepool: {{ .Values.nodepool }}
      tolerations:
        {{- include "vllm-serving.tolerations" . | nindent 8 }}
      {{- include "vllm-serving.podClaims" . | nindent 6 }}
      initContainers:
        {{- include "vllm-serving.modelDownload" . | nindent 8 }}
      containers:
        # 1. Compile + latency test, then signal the uploader.
        - name: compile
          image: {{ .Values.image }}
          command:
            - /bin/bash
            - -c
            - |
              vllm bench latency "$@" && touch /signal/done || { touch /signal/failed; exit 1; }
            - vllm-bench
            - --model={{ $dir }}
            {{- range include "vllm-serving.engineArgs" . | fromJsonArray }}
            - {{ . | quote }}
            {{- end }}
            - --input-len={{ $c.inputLen }}
            - --output-len={{ $c.outputLen }}
            - --batch-size={{ $c.batchSize }}
            - --num-iters-warmup={{ $c.numItersWarmup }}
            - --num-iters={{ $c.numIters }}
            - --output-json=/signal/latency.json
          resources:
            {{- include "vllm-serving.resources" . | trim | nindent 12 }}
          env:
            {{- include "vllm-serving.env" . | nindent 12 }}
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: local-storage
              mountPath: {{ .Values.paths.models }}
            {{- include "vllm-serving.nkiCacheMount" . | nindent 12 }}
            - name: signal
              mountPath: /signal
        # 2. Upload: sync the compile cache to S3 (only new files transfer) and
        # store the latency result next to it.
        - name: upload
          image: {{ .Values.awsCliImage }}
          command: ["/bin/bash", "-c"]
          env:
            - name: AWS_REGION
              value: {{ .Values.region }}
          args:
            - |
              set -euo pipefail
              until [ -f /signal/done ] || [ -f /signal/failed ]; do sleep 10; done
              [ -f /signal/done ] || { echo "compile failed - nothing to upload" >&2; exit 1; }
              aws configure set s3.preferred_transfer_client crt
              # NEFFs only: the NKI kernel cache points at this pod's /var/tmp.
              aws s3 sync "{{ $dir }}/{{ .Values.cacheDir }}/" "{{ $s3 }}/{{ .Values.cacheDir }}/" --exclude "neuron/compile_cache/nki/*"
              aws s3 cp /signal/latency.json "{{ $s3 }}/{{ .Values.cacheDir }}/results/{{ .Release.Name }}-latency.json"
              echo "Uploaded {{ $dir }}/{{ .Values.cacheDir }}/ to {{ $s3 }}/{{ .Values.cacheDir }}/"
          volumeMounts:
            - name: local-storage
              mountPath: {{ .Values.paths.models }}
            - name: signal
              mountPath: /signal
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
        # The node's NVMe, same as serving: a serving pod scheduled here later
        # finds the cache locally too.
        - name: local-storage
          hostPath:
            path: {{ .Values.paths.nodeLocal }}
            type: Directory
        - name: signal
          emptyDir: {}
{{- end }}
