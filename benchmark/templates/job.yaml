{{- $root := . }}
{{- $b := .Values.benchmark }}
{{- if not $b.storage.s3.bucketName }}
{{- fail "benchmark.storage.s3.bucketName is required (--set benchmark.storage.s3.bucketName=$S3_BUCKET_NAME)" }}
{{- end }}
{{- $t := $b.target }}
{{- if not (and $t.label $t.baseUrl) }}
{{- fail "benchmark.target.label and .baseUrl are required - pass an endpoint file, e.g. -f benchmark/values-trn2-48xl.yaml" }}
{{- end }}
{{- $ctx := dict "root" $root "t" $t }}
# One Job per release (= per endpoint). Its tests run sequentially (runOrder),
# so the latency test sees zero competing load.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "benchmark.targetName" $ctx }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "benchmark.labels" $ctx | nindent 4 }}
spec:
  backoffLimit: {{ $b.job.backoffLimit }}
  ttlSecondsAfterFinished: {{ $b.job.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "benchmark.labels" $ctx | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $b.serviceAccount }}
      {{- with $b.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        - key: karpenter
          operator: Exists
          effect: NoSchedule
      containers:
      - name: inference-perf
        image: {{ $b.image.repository }}:{{ $b.image.tag }}
        imagePullPolicy: {{ $b.image.pullPolicy }}
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          {{- if $b.dependencies.packages }}
          pip install --no-cache-dir {{ range $b.dependencies.packages }}{{ . | quote }} {{ end }}
          {{- end }}
          # Store the target's cost basis next to its results (boto3 ships with
          # inference-perf for its S3 storage).
          python3 -c 'import boto3,sys; boto3.client("s3").upload_file("/workspace/configs/target.json", sys.argv[1], sys.argv[2])' \
            {{ $b.storage.s3.bucketName | quote }} {{ printf "%s/%s/target.json" $b.storage.s3.pathPrefix $t.label | quote }}
          for t in {{ range $b.runOrder }}{{ . }} {{ end }}; do
            cfg="/workspace/configs/config-$t.yml"
            [ -f "$cfg" ] || continue
            echo "=========================================="
            echo "TEST: $t   target: {{ $t.label }} @ {{ $t.baseUrl }}"
            echo "=========================================="
            inference-perf --config_file "$cfg"
          done
          echo "All benchmark tests complete for {{ $t.label }}."
        env:
        - name: TOKENIZERS_PARALLELISM
          value: "false"
        volumeMounts:
        - name: configs
          mountPath: /workspace/configs
        resources:
          {{- toYaml $b.resources | nindent 10 }}
      volumes:
      - name: configs
        configMap:
          name: {{ include "benchmark.targetName" $ctx }}
