apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - name: ${gpu_ami_name}
  instanceStorePolicy: RAID0
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        deleteOnTermination: true
        encrypted: true
        volumeSize: 500Gi
        volumeType: gp3
  detailedMonitoring: true
  role: "${name}-karpenter-node"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${name}"
    - tags:
        kubernetes.io/cluster/${name}: owned
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${name}"
        kubernetes.io/role/internal-elb: "1"
  # GPU Capacity Blocks from var.capacity_blocks. Only the generated Capacity Block
  # pools launch into them; the on-demand GPU pools are unaffected.
%{ if length(gpu_capacity_reservation_ids) > 0 ~}
  capacityReservationSelectorTerms:
%{ for id in gpu_capacity_reservation_ids ~}
    - id: ${id}
%{ endfor ~}
%{ endif ~}
  tags:
    karpenter.sh/discovery: "${name}"
    nvidia-gpu: "true"
