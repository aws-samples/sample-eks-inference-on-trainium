apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: x86-cpu-karpenter
spec:
  # Static capacity: always keep 1 x86 node warm (hosts the Ray head, etc.).
  # Static nodes are not consolidated.
  replicas: 1
  template:
    metadata:
      labels:
        instanceType: mixed-x86
        provisionerType: Karpenter
    spec:
      taints:
        - key: karpenter
          value: "true"
          effect: "NoSchedule"
      requirements:
        - key: "karpenter.k8s.aws/instance-family"
          operator: In
          values: ["c5", "m5", "r5"]
        - key: "karpenter.k8s.aws/instance-size"
          operator: In
          values: ["4xlarge", "8xlarge"]
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["on-demand"]
      expireAfter: 720h
      terminationGracePeriod: 24h
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: x86-cpu-karpenter
  # Static mode allows only the `nodes` limit. 2 gives headroom so an
  # expiring/drifting node can be replaced without dropping below 1.
  limits:
    nodes: 2
