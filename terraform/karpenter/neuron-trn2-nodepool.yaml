apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: neuron-trn2
spec:
  # Static capacity: always keep 1 trn2 node warm. Static nodes are not consolidated.
  # Hosts the single-instance gpt-oss-20b deployment (TP8, BF16) on one trn2.48xlarge.
  replicas: 1
  template:
    metadata:
      labels:
        instanceType: trn2
        provisionerType: Karpenter
        neuron.amazonaws.com/neuron-device: "true"
    spec:
      taints:
        - key: aws.amazon.com/neuron
          value: "true"
          effect: "NoSchedule"
        - key: karpenter
          value: "true"
          effect: "NoSchedule"
      requirements:
        - key: "karpenter.k8s.aws/instance-family"
          operator: In
          values: ["trn2"]
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]
        # Pin to the reservation's AZ (cr-010b7bafdf7c6c192 is in us-east-2b).
        - key: "topology.kubernetes.io/zone"
          operator: In
          values: ["us-east-2b"]
        # Use the ML Capacity Block declared on the neuron NodeClass. Reserved
        # capacity is the only option here; add "on-demand" back to fall back if
        # the reservation is exhausted/ended (note: capacity blocks end at their
        # EndDate - after that reserved launches fail).
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["reserved"]
      expireAfter: 720h
      terminationGracePeriod: 24h
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: neuron
  # Static mode allows only the `nodes` limit. Set to 2 for headroom so an
  # expiring/drifting node can be replaced without dropping below 1.
  limits:
    nodes: 2
