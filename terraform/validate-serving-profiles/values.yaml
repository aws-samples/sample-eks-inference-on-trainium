# Default values for the validate-serving-profiles chart.
#
# Installed by Terraform (terraform/serving-bootstrap.tf): the platform team edits
# var.serving_profiles + infra vars in tfvars, and Terraform renders them, with
# region / S3 paths / images, into these values. Don't install it by hand.
#
# Publishes the cluster's catalog of supported serving configs ("profiles"):
#   - vllm-profile-<name> ConfigMap per profile: serve config as env vars (data)
#     plus placement/image as a JSON annotation (serving.platform/spec). Users
#     discover them with `kubectl get cm -l serving.platform/profile` and deploy
#     endpoints with the `serving` chart, which reads the profile at install time.
#   - vllm-serve-script ConfigMap: the vended launch scripts (vllm serve + Ray app).
#   - model-compile-<name>-<hash> Job per Neuron profile: precompiles the NEFFs
#     and pushes them to S3, so serving that profile is a cache hit.

# ---- Infra (set by Terraform) -------------------------------------------------
region: ""
# Models (from var.models), keyed by model name = the model's folder:
# s3://<bucket>/<name>/ in S3, /tmp/models/<name>/ on nodes. Profiles pick one.
models: {}
#  gpt-oss-20b:
#    hfRepoId: openai/gpt-oss-20b
#    s3Uri: s3://<bucket>/gpt-oss-20b            # weights; cache/ = shared compile cache
#    weightsReadyUri: s3://<bucket>/gpt-oss-20b/.ready/weights
images:
  # Pinned per hardware so users can't pick an image that misses the NEFF cache
  # (the compiler/SDK version is part of the cache key).
  neuron: ""                # vLLM-Neuron DLC (compile Jobs + vLLM serving)
  neuronRay: ""             # Ray serving image, built FROM images.neuron
  gpu: ""                   # vLLM CUDA image for gpu profiles, e.g. vllm/vllm-openai:<tag>
  awsCli: amazon/aws-cli
ray:
  version: ""               # Ray version baked into images.neuronRay

# ---- Cluster conventions ------------------------------------------------------
serviceAccounts:
  uploader: model-uploader  # S3 read/write (compile Jobs)
  reader: model-reader      # S3 read-only (serving pods)
paths:
  nodeLocal: /mnt/k8s-disks/0   # NVMe instance store on accelerator nodes (hostPath)
  models: /tmp/models           # where nodeLocal is mounted in pods

# Per-hardware defaults. A profile's `hardware` selects one of these.
hardware:
  neuron:
    compile: true             # precompile NEFFs per profile
    deviceResource: aws.amazon.com/neuron
    imageKey: neuron          # images.<imageKey>
    tolerations:
      - key: aws.amazon.com/neuron
        operator: Exists
        effect: NoSchedule
      - key: karpenter
        operator: Exists
        effect: NoSchedule
    env:
      # Nodes here have no EFA; EFA affinity is a CPU perf hint, not required for
      # single-instance TP (collectives use NeuronLink).
      NEURON_SKIP_EFA_AFFINITY: "1"
      # gpt-oss needs long compile/execute timeouts.
      VLLM_NEURON_COMPILATION_TIMEOUT: "1200"
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1200"
  gpu:
    compile: false            # vLLM on CUDA has no offline compile step
    deviceResource: nvidia.com/gpu
    imageKey: gpu
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: karpenter
        operator: Exists
        effect: NoSchedule
    env: {}

# ---- Compile Jobs -------------------------------------------------------------
compile:
  enabled: true
  # Max wait for vLLM /health (= compile done) before failing the Job.
  timeoutSeconds: 7200

# Profiles are immutable: changing an existing profile's config fails the
# upgrade (running deployments were compiled for the old config). Add a new
# profile name instead (e.g. trn2-tp8-16k-v2). Set true to override.
allowProfileMutation: false

# Content hash of this chart, set by Terraform so template edits roll the release.
chartChecksum: ""

# ---- Profiles (from var.serving_profiles) -------------------------------------
# Names become K8s object names: lowercase letters, digits and '-', max 40 chars.
#
#   model                model (key of `models`)
#   hardware             neuron | gpu (key into `hardware` above)
#   nodepool             Karpenter NodePool for compile + serving
#   devices              accelerator devices per pod (hardware.deviceResource)
#   resources            cpu / memory for the serving + compile pods
#   tensorParallelSize   --tensor-parallel-size
#   maxModelLen          --max-model-len
#   maxNumSeqs           --max-num-seqs
#   maxNumBatchedTokens  --max-num-batched-tokens
#   hfOverrides          --hf-overrides JSON string (optional)
#   additionalConfig     --additional-config JSON string (optional)
#   env                  extra env for this profile (optional)
profiles: {}
