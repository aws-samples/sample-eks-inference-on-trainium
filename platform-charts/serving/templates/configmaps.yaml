{{- /*
Copies of the profile env and the vended scripts, pinned to this release: a later
platform change doesn't alter running pods until `helm upgrade`, and the release
works from any namespace.
*/ -}}
{{- range $e := include "serving.endpoints" . | fromJsonArray }}
{{- $ctx := dict "root" $ "name" $e.name "ep" $e.ep }}
{{- $r := include "serving.profile" $ctx | fromJson }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $ctx.name }}-env
  labels:
    {{- include "serving.labels" $ctx | nindent 4 }}
data:
  {{- toYaml $r.env | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $ctx.name }}-scripts
  labels:
    {{- include "serving.labels" $ctx | nindent 4 }}
data:
  {{- toYaml $r.scripts | nindent 2 }}
{{- end }}
