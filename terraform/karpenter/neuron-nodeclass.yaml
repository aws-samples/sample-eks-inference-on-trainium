apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: neuron
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - name: ${neuron_ami_name}
  instanceStorePolicy: RAID0
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        deleteOnTermination: true
        encrypted: true
        volumeSize: 500Gi
        volumeType: gp3
  role: "${name}-karpenter-node"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${name}"
    - tags:
        kubernetes.io/cluster/${name}: owned
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${name}"
        kubernetes.io/role/internal-elb: "1"
  # ML Capacity Block reservations. Karpenter only launches into a reservation
  # when a NodePool's requirements (instance-family, AZ, ...) match it, so this
  # is safe to share with the trn1/inf2 pools - only neuron-trn2 (reserved,
  # trn2) will use it. ID comes from var.trn2_capacity_reservation_id.
  capacityReservationSelectorTerms:
    - id: ${trn2_capacity_reservation_id}
  tags:
    karpenter.sh/discovery: "${name}"
    aws-neuron: "true"
