# gpt-oss-20b on one p5.4xlarge: 1 replica x TP1 (1 H100).
# Same serving configuration as values-p5-48xl.yaml, on a single GPU.
hardware: gpu
nodepool: gpu-p5-4xl
model: gpt-oss-20b
replicas: 1
# Stays below the node's allocatable (16 vCPU / 256 GiB).
resources: { devices: 1, cpu: "12", memory: 200Gi }
vllm:
  tensorParallelSize: 1
  maxModelLen: 8192
  maxNumSeqs: 4
  maxNumBatchedTokens: 8192
  extraArgs:
    - --dtype=bfloat16
