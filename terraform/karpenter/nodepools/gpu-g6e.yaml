apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-g6e
spec:
  # Dynamic, on-demand (or Spot) GPU capacity: any g6e size (NVIDIA L40S 48 GB,
  # 1 GPU up to g6e.16xlarge, 4-8 on 12x/24x/48xlarge; every size has NVMe
  # instance store for the model cache). Karpenter picks the cheapest size that
  # fits the pod and falls back to the next on insufficient capacity; the limits
  # below rule out sizes larger than they allow. It launches a node when a pod
  # needs one and consolidates it away when it's empty.
  template:
    metadata:
      labels:
        provisionerType: Karpenter
        nvidia.com/gpu: "true"
        # Where the NVIDIA DRA kubelet plugin runs; set here so it's on the node
        # from boot (the pinned AMI isn't the al2023@latest alias that sets it).
        nvidia.com/gpu.present: "true"
    spec:
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: "NoSchedule"
        - key: karpenter
          value: "true"
          effect: "NoSchedule"
      requirements:
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["g6e"]
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["on-demand", "spot"]
      expireAfter: 720h
      terminationGracePeriod: 24h
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu
  limits:
    nvidia.com/gpu: 4
    cpu: 64
    memory: 512Gi
  disruption:
    consolidateAfter: 300s
    consolidationPolicy: WhenEmptyOrUnderutilized
