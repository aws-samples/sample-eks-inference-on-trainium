# Cluster-wide convention: any Service labeled `metrics: enabled` with a port
# named `http` is scraped at /metrics every 1s (e.g. the standalone vLLM
# deployments) - fine-grained enough to see batching / queueing during benchmarks.
# Prometheus Operator ignores prometheus.io/* annotations, so workloads opt in
# with the label instead of needing their own monitor.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: metrics-enabled
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      metrics: enabled
  # The pod's $/hr (vllm-serving: deviceHourlyUsd x devices) on every series it
  # exports, as usd_per_hour: the Benchmark dashboards' $ per 1M output tokens.
  podTargetLabels:
    - usd-per-hour
  endpoints:
    - port: http
      path: /metrics
      interval: 1s
      scrapeTimeout: 1s
      scheme: http
      # A finished pod (e.g. a bench Job's) stays in its Service as a not-ready
      # address, and Prometheus scrapes those too: once its IP is reused by the
      # next pod on the node, that pod's metrics also show up under the old
      # Service. The operator's built-in pod-phase drop misses them (the pod
      # phase Prometheus sees stays Running), so scrape ready addresses only.
      relabelings:
        - sourceLabels: [__meta_kubernetes_endpoint_ready]
          regex: "false"
          action: drop
